<!DOCTYPE html>
<html>

<head>
  <title>Rice Price Predictors</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#B8E2B0]">

  <div id="welcomePopup" class="fixed inset-0 flex items-center justify-center bg-black/50 z-50 hidden">

    <div class="bg-white rounded-xl shadow-xl p-8 text-center max-w-md w-[90%]">
      <h2 class="text-2xl font-bold text-green-700 mb-4">Welcome</h2>

      <p id="greetingMessage" class="text-lg text-gray-700 mb-6"></p>

      <button onclick="closePopup()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">
        Continue
      </button>
    </div>

  </div>

  <div class="flex items-center space-x-4 bg-[#228B22] w-100 h-20 pl-6 pr-6 text-lg shadow-xl top-0">

    <div class="text-white font-semibold mr-6">
      Rice Price Predictors
    </div>

    <!-- Type of Rice -->
    <div class="flex flex-col">
      <label class="text-white text-sm font-medium mb-1">
        Type of Rice
      </label>
      <select class="bg-[#228B22] text-white border border-white rounded px-2 py-1" id="ToR">
        <option value="i" selected>Imported</option>
        <option value="l">Local</option>
      </select>
    </div>

    <!-- Variety of Rice -->
    <div class="flex flex-col">
      <label class="text-white text-sm font-medium mb-1">
        Variety of Rice
      </label>
      <select class="bg-[#228B22] text-white border border-white rounded px-2 py-1" id="VoR">
        <option value="S" selected>Special</option>
        <option value="P">Premium</option>
        <option value="W">Well-Milled</option>
        <option value="R">Regular-Milled</option>
      </select>
    </div>

    <!-- Predictor -->
    <div class="flex flex-col">
      <label class="text-white text-sm font-medium mb-1">
        Predictor
      </label>
      <select class="bg-[#228B22] text-white border border-white rounded px-2 py-1" id="Predictor">
        <option value="oil" selected>Brent Crude Oil (USD)</option>
        <option value="farm">Farmgate Value (PHP)</option>
        <option value="rate">Inflation Rate</option>
        <option value="exc">USD to PHP exchange rate</option>
      </select>
    </div>

    <div class="ml-auto flex items-center gap-3">

      <button class="bg-white text-green-800 px-4 py-1 rounded shadow hover:bg-gray-300" id="Search">
        Search
      </button>

      <button class="bg-red-500 text-white px-4 py-1 rounded shadow hover:bg-red-600" id="Clear">
        Clear
      </button>

    </div>

    <div>
      <a href="index.html">
        <button class="flex items-center gap-2 bg-white text-green-800 font-semibold px-4 py-1 rounded shadow hover:bg-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9.75L12 3l9 6.75M4.5 10.5V21h6v-6h3v6h6V10.5" />
          </svg> Home
        </button>
      </a>
    </div>

  </div>

  <div class="flex flex-col items-center gap-8 w-85vh pt-8">

    <iframe src="Visualizations/default_graph.html" class="w-[95vw] h-[70vh] border rounded-lg shadow"
      title="Default Page" id="Graph">
    </iframe>

  </div>

  <footer class="fixed bottom-0 left-0 w-full bg-gray-900 text-white text-center py-3 text-base font-semibold">
    Rice Price Predictor • Thesis Project • 2026
  </footer>

  <script src="greetings.js"></script>
  <script src="loader.js"></script>
  <script src="searchgraph.js"></script>
</body>

</html>
